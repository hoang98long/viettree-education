[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "viettree-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3",
  "argon2-cffi>=23.1,<26", "alembic>=1.14,<2",
  "httpx>=0.28,<1", "Pillow>=11,<14",
  "tzdata>=2025,<2027",
  "anyio>=4.8,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.academy" = ["schema.sql", "assets/*.svg", "data/*.json"]
"app.classroom" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: PostgreSQL trong transaction rollback độc lập"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
line-ending = "lf"
