# Merge after docker-compose.production.yml. Requires Compose >= 2.24.4.
# Baseline: 3 vCPU, 2 GiB RAM, 50 GB SSD; images built on another machine.
x-small-logging: &small-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  db:
    mem_limit: 512m
    memswap_limit: 768m
    cpus: 1.0
    pids_limit: 128
    shm_size: 128m
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - autovacuum_work_mem=16MB
      - -c
      - autovacuum_max_workers=1
      - -c
      - max_connections=30
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_parallel_maintenance_workers=0
      - -c
      - wal_buffers=4MB
      - -c
      - min_wal_size=64MB
      - -c
      - max_wal_size=256MB
      - -c
      - jit=off
    logging: *small-logging

  backend:
    build: !reset null
    platform: linux/amd64
    mem_limit: 448m
    memswap_limit: 640m
    cpus: 1.5
    pids_limit: 128
    environment:
      SERVER_WORKERS: "1"
      SERVER_LIMIT_CONCURRENCY: "96"
      PASSWORD_VERIFY_CONCURRENCY: "1"
      DB_POOL_SIZE: "4"
      DB_POOL_MAX_OVERFLOW: "2"
      DB_POOL_TIMEOUT: "10"
      AI_TRAINING_ONLY: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=15)"]
      timeout: 20s
      start_period: 60s
    logging: *small-logging

  frontend:
    build: !reset null
    platform: linux/amd64
    mem_limit: 384m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 128
    environment:
      NODE_OPTIONS: "--max-old-space-size=192"
    logging: *small-logging

  caddy:
    mem_limit: 96m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 128
    environment:
      GOMEMLIMIT: "64MiB"
      GOMAXPROCS: "1"
    logging: *small-logging

  migrate:
    platform: linux/amd64
    mem_limit: 256m
    memswap_limit: 384m
    cpus: 1.0
    pids_limit: 128
    logging: *small-logging
