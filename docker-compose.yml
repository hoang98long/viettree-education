services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-viettree}
      POSTGRES_USER: ${POSTGRES_USER:-viettree}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viettree}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-viettree}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-viettree-minio}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports: ["3000:3000"]
    depends_on: [backend]
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: [./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [frontend, backend]

volumes:
  postgres_data:
  minio_data:
