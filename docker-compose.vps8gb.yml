# Merge after production. Runtime budget for 4 vCPU / 8 GB RAM / 100 GB SSD.
# Ceilings, not reservations; leave memory for Linux, Docker, cache and backups.
services:
  db:
    mem_limit: 2g
    memswap_limit: 2560m
    cpus: 2.0
    pids_limit: 256
    shm_size: 256m
    environment:
      TZ: UTC
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - autovacuum_work_mem=64MB
      - -c
      - autovacuum_max_workers=2
      - -c
      - max_connections=60
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - wal_buffers=16MB
      - -c
      - min_wal_size=256MB
      - -c
      - max_wal_size=1GB
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      - jit=off

  backend:
    mem_limit: 1536m
    memswap_limit: 2g
    cpus: 2.0
    pids_limit: 256
    environment:
      TZ: UTC
      SERVER_WORKERS: "2"
      SERVER_LIMIT_CONCURRENCY: "128"
      PASSWORD_VERIFY_CONCURRENCY: "2"
      DB_POOL_SIZE: "4"
      DB_POOL_MAX_OVERFLOW: "2"
      DB_POOL_TIMEOUT: "10"
      AI_TRAINING_ONLY: "true"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=15)",
        ]
      timeout: 20s
      start_period: 60s

  frontend:
    mem_limit: 1g
    memswap_limit: 1280m
    cpus: 1.5
    pids_limit: 256
    environment:
      TZ: UTC
      NODE_OPTIONS: "--max-old-space-size=512"

  caddy:
    mem_limit: 256m
    memswap_limit: 384m
    cpus: 0.75
    pids_limit: 128
    environment:
      TZ: UTC
      GOMEMLIMIT: "192MiB"
      GOMAXPROCS: "2"
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-true}

  migrate:
    mem_limit: 512m
    memswap_limit: 768m
    cpus: 1.0
    pids_limit: 128
    environment:
      TZ: UTC
