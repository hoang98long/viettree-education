name: Verify release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: viettree-ci-test
          POSTGRES_PASSWORD: ci-only-ephemeral-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d viettree-ci-test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: development
      DB_NAME: viettree-ci-test
      DB_USER: postgres
      DB_PASSWORD: ci-only-ephemeral-password
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-ephemeral-password@localhost:5432/viettree-ci-test
      SEED_ADMIN_PASSWORD: CI administrator password 2026!
      SEED_STUDENT_PASSWORD: CI student password 2026!
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-lock.txt && python -m pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: python -m app.cli import-schema && python -m alembic upgrade head && python -m app.cli seed
      - run: pytest -q
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test && npm run lint && npm run format:check
      - run: npm run build && npm run typecheck
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/backend.production.Dockerfile -t viettree-backend:ci .
      - run: docker build -f deploy/frontend.production.Dockerfile -t viettree-frontend:ci .
